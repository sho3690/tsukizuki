<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="月々">
<meta name="description" content="サブスクの月額と年額を、ひと目で。登録内容は端末の中にだけ保存されます。">
<title>月々 — サブスクの帳簿</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
:root{
  color-scheme: light dark;
  /* 家の色（design-system.md） */
  --color-blue-950:#03045e; --color-blue-900:#023e8a; --color-blue-700:#0077b6; --color-blue-600:#0096c7;
  --color-blue-500:#00b4d8; --color-blue-300:#48cae4; --color-blue-200:#90e0ef; --color-blue-100:#ade8f4; --color-blue-50:#caf0f8;
  --color-neutral-50:#f8f9fa; --color-neutral-100:#e9ecef; --color-neutral-200:#dee2e6; --color-neutral-300:#ced4da;
  --color-neutral-400:#adb5bd; --color-neutral-600:#6c757d; --color-neutral-700:#495057; --color-neutral-800:#343a40; --color-neutral-900:#212529;

  --color-background:var(--color-neutral-50);
  --color-surface:#ffffff;
  --color-surface-muted:var(--color-neutral-100);
  --color-text-primary:var(--color-neutral-900);
  --color-text-secondary:var(--color-neutral-700);
  --color-text-muted:var(--color-neutral-600);
  --color-border:var(--color-neutral-200);
  --color-border-strong:var(--color-neutral-300);
  --color-input-border:var(--color-neutral-600);
  --color-primary:var(--color-blue-900);
  --color-primary-hover:var(--color-blue-950);
  --color-primary-muted:var(--color-blue-50);
  --color-on-primary:#ffffff;
  --color-focus-ring:var(--color-blue-600);
  --color-error:#b42318;
  --color-error-muted:#fef3f2;
  --color-inverse-surface:var(--color-neutral-900);
  --color-inverse-text:#ffffff;
  --color-inverse-link:var(--color-blue-200);
  --color-switch-off:var(--color-neutral-600);
  --color-knob:#ffffff;

  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);

  --font-size-xs:.75rem; --font-size-sm:.875rem; --font-size-md:1rem; --font-size-lg:1.125rem; --font-size-xl:1.25rem;
  --font-size-2xl:1.5rem; --font-size-3xl:2rem; --font-size-4xl:2.5rem;
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem;
  --space-8:2rem; --space-10:2.5rem; --space-12:3rem; --space-16:4rem; --space-20:5rem;
  --radius-sm:.375rem; --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem;
  --width-content:960px;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(0,0,0,1);
  --dur-short:150ms; --dur-medium:250ms;
  --header-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    /* 家はライト前提なので、新しい色相を作らず neutral の3段と青の持ち上げだけで組む */
    --color-background:#212529;
    --color-surface:#343a40;
    --color-surface-muted:#495057;
    --color-text-primary:#f8f9fa;
    --color-text-secondary:#dee2e6;
    --color-text-muted:#adb5bd;
    --color-border:#495057;
    --color-border-strong:#6c757d;
    --color-input-border:#adb5bd;
    --color-primary:#48cae4;
    --color-primary-hover:#90e0ef;
    --color-primary-muted:color-mix(in srgb,#48cae4 10%,#343a40);
    --color-on-primary:#212529;
    --color-focus-ring:#48cae4;
    --color-error:#f5a097;
    --color-error-muted:color-mix(in srgb,#f5a097 14%,#343a40);
    --color-inverse-surface:#f8f9fa;
    --color-inverse-text:#212529;
    --color-inverse-link:#023e8a;
    --color-switch-off:#adb5bd;
    --color-knob:#212529;
    --shadow-md:0 4px 12px rgba(0,0,0,.4);
  }
}

*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--color-background);color:var(--color-text-primary);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.wrap{max-width:var(--width-content);margin-inline:auto;padding-inline:var(--space-4)}
@media (min-width:600px){.wrap{padding-inline:var(--space-6)}}
.ico{width:18px;height:18px;flex:none}

/* ── ヘッダー（スクロール後だけ下線） ── */
.top{position:sticky;top:0;z-index:10;background:var(--color-background);border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top);transition:border-color var(--dur-short) var(--ease-standard)}
.top.is-stuck{border-bottom-color:var(--color-border)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);height:var(--header-h)}
.brand{display:flex;align-items:baseline;gap:var(--space-3);min-width:0}
.brand h1{font-size:var(--font-size-xl);font-weight:600;letter-spacing:.08em;line-height:1.2}
.brand .sub{font-size:var(--font-size-sm);color:var(--color-text-secondary);white-space:nowrap}
.head-actions{display:flex;align-items:center;gap:var(--space-2);flex:none}

/* ── ボタン（家: Primary は1区画に1つ、破壊は赤） ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-5);border-radius:var(--radius-md);font-weight:600;font-size:var(--font-size-md);line-height:1.2;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color var(--dur-short) var(--ease-standard),border-color var(--dur-short) var(--ease-standard),color var(--dur-short) var(--ease-standard)}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-primary:active{background:color-mix(in srgb,var(--color-primary-hover) 90%,var(--color-on-primary))}
.btn-secondary{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-border-strong)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-surface) 92%,var(--color-text-primary))}
.btn-secondary:active{background:color-mix(in srgb,var(--color-surface) 90%,var(--color-text-primary))}
.btn-tertiary{background:transparent;color:var(--color-primary);padding-inline:var(--space-3)}
.btn-tertiary:hover{background:color-mix(in srgb,var(--color-text-primary) 8%,transparent)}
.btn-tertiary:active{background:color-mix(in srgb,var(--color-text-primary) 10%,transparent)}
.btn-danger{background:var(--color-surface);color:var(--color-error);border-color:var(--color-error)}
.btn-danger:hover{background:color-mix(in srgb,var(--color-surface) 92%,var(--color-error))}
.btn-danger:active{background:color-mix(in srgb,var(--color-surface) 90%,var(--color-error))}
.btn-danger-filled{background:var(--color-error);color:#ffffff}
.btn-danger-filled:hover{background:color-mix(in srgb,var(--color-error) 90%,var(--color-neutral-900))}
.btn-danger-filled:active{background:color-mix(in srgb,var(--color-error) 85%,var(--color-neutral-900))}
.btn-icon{width:44px;padding:0}
.btn-icon .ico{width:20px;height:20px}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--color-surface-muted);color:var(--color-text-muted);border-color:var(--color-border-strong);cursor:not-allowed}

/* ── 本体レイアウト ── */
main{min-height:calc(100dvh - var(--header-h) - env(safe-area-inset-top));display:grid;align-content:center;padding-block:var(--space-6) var(--space-10)}
@media (min-width:600px){main{padding-block:var(--space-8)}}
.layout{display:grid;gap:var(--space-12)}
.col{display:grid;gap:var(--space-12);min-width:0}
@media (min-width:600px){.layout{gap:var(--space-10)}}

/* ── 合計: 月あたり / 年あたり の2ブロック ── */
.totals{display:grid;gap:var(--space-4)}
@media (min-width:600px){.totals{grid-template-columns:1fr 1fr}}
.total{padding:var(--space-6) var(--space-5);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
@media (min-width:600px){.total{padding:var(--space-8) var(--space-6)}}
.total-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.total h2{font-size:var(--font-size-xl);font-weight:600;line-height:1.3}
.total .when{font-size:var(--font-size-md);color:var(--color-text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.amount{margin-top:var(--space-3);font-size:clamp(2.5rem,12vw,3.5rem);font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.06em;white-space:nowrap;color:var(--color-primary)}
.amount .yen{font-size:.55em;font-weight:500}
.amount-year{font-size:clamp(2rem,9.5vw,2.75rem);color:var(--color-text-primary)}
@media (min-width:600px){.amount{font-size:clamp(2.25rem,5.5vw,3.5rem)}.amount-year{font-size:clamp(1.75rem,4.2vw,2.75rem)}}
.meta{margin-top:var(--space-3);color:var(--color-text-secondary);font-size:var(--font-size-md);font-variant-numeric:tabular-nums}

/* ── 区画の見出し ── */
.ledger{min-width:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4)}
.section-head h2{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-xl);font-weight:600;line-height:1.3}
.badge{font-size:var(--font-size-sm);font-weight:600;line-height:1;padding:6px 10px;border-radius:999px;background:var(--color-surface-muted);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.badge:empty{display:none}
.tools{display:flex;align-items:center;gap:var(--space-2)}
.sort{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.select{min-height:44px;padding:0 var(--space-3);border:1px solid var(--color-input-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);font:inherit;font-size:var(--font-size-sm);cursor:pointer;transition:border-color var(--dur-short) var(--ease-standard)}
.select:hover{border-color:var(--color-text-primary)}
.nav{display:none;gap:var(--space-2)}
@media (min-width:600px) and (hover:hover){.nav{display:inline-flex}}

/* ── カードの列。画面の端まで流れ、次のカードが少し覗く。スクロールバーは進捗バーで代用 ── */
.track{display:flex;gap:var(--space-3);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;margin-inline:calc(var(--space-4) * -1);padding:3px var(--space-4) var(--space-2);scroll-padding-inline:var(--space-4)}
.track::-webkit-scrollbar{display:none}
@media (min-width:600px){.track{margin-inline:calc(var(--space-6) * -1);padding-inline:var(--space-6);scroll-padding-inline:var(--space-6)}}
@media (min-width:840px){.track{margin-inline:-4px;padding-inline:4px;scroll-padding-inline:4px}.card{width:280px}}
.track > li{flex:none;display:flex;scroll-snap-align:start}
.card{position:relative;display:flex;flex-direction:column;gap:var(--space-4);width:min(78vw,320px);min-height:224px;padding:var(--space-6) var(--space-5);margin:0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);text-align:left;cursor:pointer;transition:border-color var(--dur-short) var(--ease-standard),background-color var(--dur-short) var(--ease-standard)}
.card:hover{border-color:var(--color-primary);background:color-mix(in srgb,var(--color-surface) 96%,var(--color-text-primary))}
.card:active{background:color-mix(in srgb,var(--color-surface) 92%,var(--color-text-primary))}
.card:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.tag{display:inline-block;align-self:flex-start;font-size:var(--font-size-sm);line-height:1.4;padding:3px var(--space-3);border:1px solid var(--color-border-strong);border-radius:999px;color:var(--color-text-secondary)}
.card-body{display:grid;gap:2px;min-width:0}
.card .name{font-size:var(--font-size-lg);font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .memo{font-size:var(--font-size-md);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:grid;gap:2px;margin-top:auto}
.amt{display:flex;align-items:baseline;gap:.25em;font-size:var(--font-size-2xl);font-weight:600;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt .yen{font-size:.6em;font-weight:500;color:var(--color-text-secondary)}
.amt .unit{font-size:var(--font-size-md);font-weight:500;color:var(--color-text-secondary)}
.card .amt{font-size:var(--font-size-3xl)}
.card .per{font-size:var(--font-size-md);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.card.is-paused .name,.card.is-paused .amt{color:var(--color-text-secondary)}
.scrollbar{position:relative;height:3px;margin:var(--space-2) var(--space-1) 0;border-radius:2px;background:var(--color-border);overflow:hidden}
.scrollbar .thumb{position:absolute;top:0;left:0;height:100%;width:25%;border-radius:2px;background:var(--color-primary);will-change:transform}
.empty{padding:var(--space-6) var(--space-5);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.empty-title{font-size:var(--font-size-xl);font-weight:600}
.empty .hint{margin-top:var(--space-2);color:var(--color-text-secondary);font-size:var(--font-size-md);max-width:34em}
.empty .btn{margin-top:var(--space-5)}
@media (prefers-reduced-motion: reduce){.track{scroll-behavior:auto}}



/* ── シート（下から出る画面） ── */
.sheet{border:0;padding:0;background:var(--color-surface);color:var(--color-text-primary);width:100%;max-width:100%;max-height:min(92dvh,var(--vvh,100dvh));margin:auto 0 0;border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-md);overflow:auto;transform:translateY(calc(var(--drag,0px) - var(--kb,0px)))}
.sheet::backdrop{background:rgba(33,37,41,.5)}
.sheet[open]{animation:sheet-in var(--dur-medium) var(--ease-out)}
@keyframes sheet-in{from{transform:translateY(calc(var(--drag,0px) - var(--kb,0px) + 24px));opacity:0}}
@media (min-width:600px){.sheet{width:min(100% - 2rem,560px);margin:auto;border-radius:var(--radius-lg)}}
.sheet-body{--sx:var(--space-5);--sb:calc(var(--space-6) + env(safe-area-inset-bottom));position:relative;padding:var(--space-3) var(--sx) var(--sb)}
@media (min-width:600px){.sheet-body{--sx:var(--space-8);--sb:var(--space-6);padding:var(--space-8) var(--sx) var(--sb)}}
.sheet-grip{display:flex;justify-content:center;align-items:center;height:32px;margin:calc(var(--space-3) * -1) calc(var(--sx) * -1) var(--space-2);touch-action:none;cursor:grab}
.sheet-grip:active{cursor:grabbing}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--color-border-strong)}
@media (min-width:600px){.sheet-grip{display:none}}
.sheet-close{position:absolute;top:var(--space-5);right:var(--space-4);z-index:2;width:44px;height:44px;min-height:0;padding:0;border:0;border-radius:var(--radius-md);background:transparent;color:var(--color-text-secondary)}
.sheet-close:hover{background:color-mix(in srgb,var(--color-text-primary) 8%,transparent);color:var(--color-text-primary)}
@media (min-width:600px){.sheet-close{top:var(--space-6);right:var(--space-6)}}
.sheet h2{font-size:var(--font-size-2xl);font-weight:600;line-height:1.2;margin-bottom:var(--space-6);padding-right:52px}
.sheet p{color:var(--color-text-secondary)}
.sheet-actions{position:sticky;bottom:0;z-index:1;display:flex;gap:var(--space-2);align-items:center;justify-content:flex-end;margin:var(--space-6) calc(var(--sx) * -1) calc(var(--sb) * -1);padding:var(--space-3) var(--sx) var(--sb);background:var(--color-surface);border-top:1px solid var(--color-border)}
@media (max-width:599px){.sheet-actions .btn-primary{flex:1}}

/* ── 入力フォーム（家: ラベル必須、必須表示、44px以上、直し方を書くエラー） ── */
.field{display:grid;gap:var(--space-2);margin-bottom:var(--space-5)}
.field > label,.field .label{font-weight:600;font-size:var(--font-size-sm)}
.req{font-weight:400;color:var(--color-text-secondary);margin-left:var(--space-2)}
.input{width:100%;min-height:48px;padding:0 var(--space-4);border:1px solid var(--color-input-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);font:inherit;font-size:16px;transition:border-color var(--dur-short) var(--ease-standard)}
.input::placeholder{color:var(--color-text-muted)}
.input:hover{border-color:var(--color-text-primary)}
.input:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:1px;border-color:var(--color-focus-ring)}
.msg{font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.msg:empty{display:none}
.field.is-error .input{border-color:var(--color-error)}
.field.is-error .msg{color:var(--color-error)}
.amount-wrap{position:relative}
.amount-wrap .prefix{position:absolute;left:var(--space-4);top:50%;transform:translateY(-50%);color:var(--color-text-secondary);font-weight:600;pointer-events:none}
.input-amount{padding-left:calc(var(--space-4) + 1.2em);font-size:var(--font-size-xl);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.seg-item{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 var(--space-1);border:1px solid var(--color-input-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--font-size-sm);font-weight:600;color:var(--color-text-primary);text-align:center;cursor:pointer;user-select:none;transition:background-color var(--dur-short) var(--ease-standard),border-color var(--dur-short) var(--ease-standard),color var(--dur-short) var(--ease-standard)}
.seg-item input{position:absolute;inset:-1px;width:auto;height:auto;margin:0;opacity:0;cursor:pointer}
.seg-item:hover{background:color-mix(in srgb,var(--color-surface) 92%,var(--color-text-primary))}
.seg-item:has(input:checked){background:var(--color-primary-muted);border-color:var(--color-primary);color:var(--color-primary)}
.seg-item:has(input:focus-visible){outline:2px solid var(--color-focus-ring);outline-offset:2px}
.note-toggle{margin:calc(var(--space-2) * -1) 0 var(--space-5) calc(var(--space-3) * -1)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:56px;margin-bottom:var(--space-4);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.switch-title{display:block;font-weight:600;font-size:var(--font-size-sm)}
.switch-sub{display:block;font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.switch{position:relative;flex:none;width:60px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:var(--radius-md)}
.switch::before{content:"";position:absolute;left:4px;top:6px;width:52px;height:32px;border-radius:16px;background:var(--color-switch-off);transition:background-color var(--dur-short) var(--ease-standard)}
.switch::after{content:"";position:absolute;left:8px;top:10px;width:24px;height:24px;border-radius:12px;background:var(--color-knob);transition:transform var(--dur-short) var(--ease-standard)}
.switch[aria-checked="true"]::before{background:var(--color-primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.confirm{margin-top:var(--space-4);padding:var(--space-4) var(--space-5);border:1px solid var(--color-error);border-radius:var(--radius-md);background:var(--color-error-muted)}
.confirm p{color:var(--color-text-primary);font-weight:600}
.confirm .actions{display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-3)}
.set-group{padding:var(--space-4) var(--space-5) var(--space-5);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.set-group h3{font-size:var(--font-size-md);font-weight:600}
.set-desc{margin-top:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.set-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-4)}

/* ── 通知 ── */
.toast{position:fixed;left:50%;bottom:calc(var(--space-6) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:var(--space-3);width:max-content;max-width:min(calc(100vw - var(--space-8)),560px);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-5);background:var(--color-inverse-surface);color:var(--color-inverse-text);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-size:var(--font-size-sm);animation:toast-in var(--dur-medium) var(--ease-out)}
.toast .text{flex:1;min-width:0}
.toast .btn-tertiary{color:var(--color-inverse-link);min-height:44px}
.toast .btn-tertiary:hover{background:color-mix(in srgb,var(--color-inverse-text) 8%,transparent);color:var(--color-inverse-link)}
@keyframes toast-in{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0ms!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand"><h1>月々</h1><span class="sub">サブスクの帳簿</span></div>
    <div class="head-actions">
      <button type="button" class="btn btn-secondary btn-icon" id="btnSettings" aria-label="設定" title="設定"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button type="button" class="btn btn-primary" id="btnAdd"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>追加する</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="sentinel" aria-hidden="true"></div>
  <div class="layout">
    <div class="totals">
      <section class="total" aria-labelledby="hMonth">
        <div class="total-top"><h2 id="hMonth">月あたり</h2><span class="when" id="heroMonth"></span></div>
        <p class="amount"><span class="yen" aria-hidden="true">¥</span><span id="heroAmount">0</span><span class="sr">円</span></p>
        <p class="meta" id="heroCount">0件</p>
      </section>
      <section class="total" aria-labelledby="hYear">
        <div class="total-top"><h2 id="hYear">年あたり</h2></div>
        <p class="amount amount-year"><span class="yen" aria-hidden="true">¥</span><span id="heroYear">0</span><span class="sr">円</span></p>
        <p class="meta">月あたり × 12か月</p>
      </section>
    </div>

    <div class="col">
    <section class="ledger" aria-labelledby="hList">
      <div class="section-head">
        <h2 id="hList">すべてのサブスク<span class="badge" id="count"></span></h2>
        <div class="tools" id="ledgerTools">
          <label class="sort">並び替え
            <select class="select" id="sort">
              <option value="amount">金額が高い順</option>
              <option value="name">名前順</option>
            </select>
          </label>
          <div class="nav" id="nav">
            <button type="button" class="btn btn-secondary btn-icon" id="btnPrev" aria-label="前へ" aria-controls="track"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
            <button type="button" class="btn btn-secondary btn-icon" id="btnNext" aria-label="次へ" aria-controls="track"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
          </div>
        </div>
      </div>
      <ul class="track" id="track" aria-label="サブスクの一覧"></ul>
      <div class="scrollbar" id="bar" aria-hidden="true" hidden><span class="thumb" id="thumb"></span></div>
      <div class="empty" id="empty" hidden>
        <p class="empty-title">まだ登録がありません。</p>
        <p class="hint">右上の「追加する」から1件ずつ登録できます。まず様子を見たいときは、サンプルを入れて試せます。</p>
        <button type="button" class="btn btn-secondary" id="btnSample">サンプルを入れて試す</button>
      </div>
    </section>

    </div>
  </div>
</main>

<dialog class="sheet" id="dlg" aria-labelledby="dlgTitle">
  <form id="form" class="sheet-body" novalidate>
    <div class="sheet-grip" aria-hidden="true"><span class="sheet-handle"></span></div>
    <button type="button" class="btn sheet-close" aria-label="閉じる"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 id="dlgTitle">サブスクを追加</h2>
    <div class="field" id="fldName">
      <label for="fName">サービス名<span class="req">必須</span></label>
      <input class="input" id="fName" type="text" maxlength="60" autocomplete="off" enterkeyhint="next" placeholder="例: Netflix" aria-describedby="msgName">
      <p class="msg" id="msgName"></p>
    </div>
    <div class="field" id="fldAmount">
      <label for="fAmount">金額<span class="req">必須</span></label>
      <div class="amount-wrap"><span class="prefix" aria-hidden="true">¥</span><input class="input input-amount" id="fAmount" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="例: 1590" aria-describedby="msgAmount"></div>
      <p class="msg" id="msgAmount">税込の金額を数字で入力</p>
    </div>
    <div class="field">
      <span class="label" id="lblCycle">支払いの間隔</span>
      <div class="seg" role="radiogroup" aria-labelledby="lblCycle">
        <label class="seg-item"><input type="radio" name="cycle" value="month" checked><span>毎月</span></label>
        <label class="seg-item"><input type="radio" name="cycle" value="quarter"><span>3か月ごと</span></label>
        <label class="seg-item"><input type="radio" name="cycle" value="half"><span>半年ごと</span></label>
        <label class="seg-item"><input type="radio" name="cycle" value="year"><span>毎年</span></label>
      </div>
    </div>
    <div class="field" id="fldMemo" hidden>
      <label for="fMemo">メモ</label>
      <input class="input" id="fMemo" type="text" maxlength="200" autocomplete="off" enterkeyhint="done" placeholder="例: 家族プラン、解約は3月まで">
    </div>
    <button type="button" class="btn btn-tertiary note-toggle" id="btnNote">＋ メモを追加</button>
    <div class="switch-row" id="pausedRow">
      <span id="lblPaused"><span class="switch-title">一時停止</span><span class="switch-sub">一時停止中は合計に含めません</span></span>
      <button type="button" class="switch" role="switch" aria-checked="false" aria-labelledby="lblPaused" id="fPaused"></button>
    </div>
    <button type="button" class="btn btn-danger" id="btnDelete">このサブスクを削除</button>
    <div class="confirm" id="confirm" hidden>
      <p id="confirmText"></p>
      <div class="actions">
        <button type="button" class="btn btn-tertiary" id="btnDeleteNo">やめる</button>
        <button type="button" class="btn btn-danger-filled" id="btnDeleteYes">削除する</button>
      </div>
    </div>
    <div class="sheet-actions" id="actions">
      <button type="button" class="btn btn-tertiary" id="btnCancel">やめる</button>
      <button type="submit" class="btn btn-primary" id="btnSave">保存する</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="dlgSettings" aria-labelledby="setTitle">
  <div class="sheet-body">
    <div class="sheet-grip" aria-hidden="true"><span class="sheet-handle"></span></div>
    <button type="button" class="btn sheet-close" aria-label="閉じる"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 id="setTitle">設定</h2>
    <section class="set-group" aria-labelledby="setBackup">
      <h3 id="setBackup">バックアップ</h3>
      <p class="set-desc">機種変更のときは、バックアップを保存して新しい端末で読み込んでください。</p>
      <div class="set-actions">
        <button type="button" class="btn btn-secondary" id="btnExport"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>バックアップを保存</button>
        <button type="button" class="btn btn-secondary" id="btnImport"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4-4 4M5 19h14"/></svg>バックアップを読み込む</button>
        <input type="file" id="fileImport" accept=".json,application/json" hidden>
      </div>
    </section>
    <div class="sheet-actions">
      <button type="button" class="btn btn-tertiary" id="btnSettingsClose">閉じる</button>
    </div>
  </div>
</dialog>

<dialog class="sheet" id="dlgImport" aria-labelledby="impTitle">
  <div class="sheet-body">
    <div class="sheet-grip" aria-hidden="true"><span class="sheet-handle"></span></div>
    <button type="button" class="btn sheet-close" aria-label="閉じる"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 id="impTitle">バックアップを読み込む</h2>
    <p id="impText"></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-tertiary" id="btnImportNo">やめる</button>
      <button type="button" class="btn btn-primary" id="btnImportYes">置き換えて読み込む</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden>
  <span class="text" id="toastText"></span>
  <button type="button" class="btn btn-tertiary" id="toastAction" hidden></button>
</div>

<script>
(() => {
'use strict';
const KEY = 'tsukizuki.v1';
const SORT_KEY = 'tsukizuki.sort';
const CYCLES = {
  month:   { label: '毎月',     unit: '/月',    months: 1 },
  quarter: { label: '3か月ごと', unit: '/3か月', months: 3 },
  half:    { label: '半年ごと',  unit: '/半年',  months: 6 },
  year:    { label: '毎年',     unit: '/年',    months: 12 },
};
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('data-')) n.setAttribute(k, v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) n.append(c);
  return n;
};

/* ── 日付（今月の表示とバックアップのファイル名にだけ使う） ── */
const pad = n => String(n).padStart(2, '0');
const toYMD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const yen = n => '¥' + fmt(n);
const monthly = it => it.amount / CYCLES[it.cycle].months;

/* ── 保存 ── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function normalize(o) {
  if (!o || typeof o !== 'object') return null;
  const name = String(o.name ?? '').trim().slice(0, 60);
  const amount = Math.round(Number(o.amount));
  const cycle = CYCLES[o.cycle] ? o.cycle : 'month';
  if (!name || !(amount > 0) || amount > 99999999) return null;
  return { id: String(o.id || uid()), name, amount, cycle, memo: String(o.memo ?? '').trim().slice(0, 200), paused: !!o.paused };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.map(normalize).filter(Boolean) : [];
  } catch (e) { return []; }
}
let items = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) { toast('保存できませんでした。ブラウザの保存領域がいっぱいか、プライベートモードの可能性があります。'); }
}
let sortMode = (() => { try { return localStorage.getItem(SORT_KEY) || 'amount'; } catch (e) { return 'amount'; } })();
if (!['amount', 'name'].includes(sortMode)) sortMode = 'amount';

/* ── 描画 ── */
const track = $('#track'), emptyEl = $('#empty');
const amountEl = (value, unit) => el('span', { class: 'amt' }, [
  el('span', { class: 'yen', 'aria-hidden': 'true', text: '¥' }),
  el('span', { text: fmt(value) }),
  el('span', { class: 'sr', text: '円' }),
  el('span', { class: 'unit', text: unit }),
]);
function render() {
  const active = items.filter(i => !i.paused);
  const paused = items.length - active.length;
  const total = active.reduce((s, i) => s + monthly(i), 0);
  const t = today();
  $('#heroMonth').textContent = `${t.getFullYear()}年${t.getMonth() + 1}月`;
  $('#heroAmount').textContent = fmt(total);
  $('#heroYear').textContent = fmt(total * 12);
  $('#heroCount').textContent = paused ? `${active.length}件が有効 · ${paused}件は一時停止中` : `${active.length}件が有効`;
  $('#count').textContent = items.length ? String(items.length) : '';

  /* カードの列。一時停止中は最後に回す */
  const sorted = [...items].sort((a, b) => {
    if (a.paused !== b.paused) return a.paused ? 1 : -1;
    if (sortMode === 'name') return a.name.localeCompare(b.name, 'ja');
    return monthly(b) - monthly(a) || a.name.localeCompare(b.name, 'ja');
  });
  track.replaceChildren();
  for (const it of sorted) {
    const foot = [amountEl(it.amount, CYCLES[it.cycle].unit)];
    if (it.cycle !== 'month') foot.push(el('span', { class: 'per', text: `≈ ${yen(monthly(it))} /月` }));
    const card = el('button', { type: 'button', class: 'card' + (it.paused ? ' is-paused' : ''), 'data-id': it.id }, [
      el('span', { class: 'tag', text: it.paused ? '一時停止中' : CYCLES[it.cycle].label }),
      el('span', { class: 'card-body' }, [el('span', { class: 'name', text: it.name }), it.memo ? el('span', { class: 'memo', text: it.memo }) : null]),
      el('span', { class: 'card-foot' }, foot),
      el('span', { class: 'sr', text: '（押すと編集）' }),
    ]);
    track.append(el('li', {}, card));
  }
  emptyEl.hidden = items.length > 0;
  $('#ledgerTools').hidden = items.length === 0;
  syncTrack();

}

/* ── 横スライド: 進捗バーと送りボタン（スクロール位置に追従） ── */
const bar = $('#bar'), thumb = $('#thumb'), nav = $('#nav'), btnPrev = $('#btnPrev'), btnNext = $('#btnNext');
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function syncTrack() {
  const max = track.scrollWidth - track.clientWidth;
  const can = max > 1;
  bar.hidden = !can; nav.hidden = !can;
  if (!can) return;
  const w = Math.max(track.clientWidth / track.scrollWidth, .12) * bar.clientWidth;
  thumb.style.width = `${Math.round(w)}px`;
  thumb.style.transform = `translateX(${Math.round((track.scrollLeft / max) * (bar.clientWidth - w))}px)`;
  btnPrev.disabled = track.scrollLeft <= 1;
  btnNext.disabled = track.scrollLeft >= max - 1;
}
let syncRaf = 0;
const queueSync = () => { if (!syncRaf) syncRaf = requestAnimationFrame(() => { syncRaf = 0; syncTrack(); }); };
track.addEventListener('scroll', queueSync, { passive: true });
window.addEventListener('resize', queueSync);
function slide(dir) {
  const first = track.querySelector('li');
  if (!first) return;
  const step = first.getBoundingClientRect().width + (parseFloat(getComputedStyle(track).columnGap) || 12);
  const n = Math.max(1, Math.floor(track.clientWidth / step));
  track.scrollBy({ left: dir * n * step, behavior: reduceMotion() ? 'auto' : 'smooth' });
}
btnPrev.addEventListener('click', () => slide(-1));
btnNext.addEventListener('click', () => slide(1));

/* ── シート共通: ×ボタン、背景タップ、つまみの下スワイプで閉じる ── */
for (const d of document.querySelectorAll('dialog.sheet')) {
  d.addEventListener('click', e => { if (e.target === d) d.close(); });
  d.querySelector('.sheet-close').addEventListener('click', () => d.close());
  const grip = d.querySelector('.sheet-grip');
  let y0 = null;
  grip.addEventListener('pointerdown', e => { y0 = e.clientY; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove', e => { if (y0 !== null) d.style.setProperty('--drag', `${Math.max(0, e.clientY - y0)}px`); });
  const release = e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null; d.style.removeProperty('--drag'); if (dy > 80) d.close(); };
  grip.addEventListener('pointerup', release);
  grip.addEventListener('pointercancel', release);
  d.addEventListener('close', () => d.style.removeProperty('--drag'));
}
/* スマホのキーボードが出たぶんだけシートを持ち上げ、高さも見える範囲に収める */
const vv = window.visualViewport;
if (vv) {
  const fit = () => {
    const root = document.documentElement.style;
    root.setProperty('--kb', `${Math.max(0, Math.round(window.innerHeight - (vv.offsetTop + vv.height)))}px`);
    root.setProperty('--vvh', `${Math.round(vv.height)}px`);
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
  fit();
}

/* ── 追加・編集 ── */
const dlg = $('#dlg'), form = $('#form');
const fName = $('#fName'), fAmount = $('#fAmount'), fMemo = $('#fMemo'), fPaused = $('#fPaused');
const fldMemo = $('#fldMemo'), btnNote = $('#btnNote'), pausedRow = $('#pausedRow'), btnDelete = $('#btnDelete');
const confirmBox = $('#confirm'), actionsBox = $('#actions');
let editingId = null;
const getCycle = () => form.querySelector('input[name="cycle"]:checked').value;
const setCycle = v => { form.querySelector(`input[name="cycle"][value="${v}"]`).checked = true; };
const toHalf = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const parseAmount = s => { const raw = toHalf(s).replace(/[¥￥,，\s円]/g, ''); return /^\d+$/.test(raw) ? Number(raw) : NaN; };
const HELP = { name: '', amount: '税込の金額を数字で入力' };
function setMsg(key, text, isError) {
  const fld = $('#fld' + key[0].toUpperCase() + key.slice(1)), msg = $('#msg' + key[0].toUpperCase() + key.slice(1));
  fld.classList.toggle('is-error', !!isError);
  msg.textContent = text;
  const input = fld.querySelector('.input');
  if (isError) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
}
function resetMsgs() { setMsg('name', HELP.name, false); setMsg('amount', HELP.amount, false); }
function openDialog(item) {
  editingId = item ? item.id : null;
  $('#dlgTitle').textContent = item ? 'サブスクを編集' : 'サブスクを追加';
  fName.value = item ? item.name : '';
  fAmount.value = item ? item.amount.toLocaleString('ja-JP') : '';
  setCycle(item ? item.cycle : 'month');
  fMemo.value = item ? item.memo : '';
  const hasMemo = !!(item && item.memo);
  fldMemo.hidden = !hasMemo; btnNote.hidden = hasMemo;
  fPaused.setAttribute('aria-checked', item && item.paused ? 'true' : 'false');
  pausedRow.hidden = !item; btnDelete.hidden = !item;
  confirmBox.hidden = true; actionsBox.hidden = false;
  resetMsgs();
  dlg.scrollTop = 0;
  dlg.showModal();
  if (!item) fName.focus();
}
function closeDialog() { dlg.close(); }
form.addEventListener('submit', e => {
  e.preventDefault();
  resetMsgs();
  let firstBad = null;
  const name = fName.value.trim();
  if (!name) { setMsg('name', 'サービス名を入力してください（例: Netflix）', true); firstBad = firstBad || fName; }
  const amount = parseAmount(fAmount.value);
  if (!(amount >= 1) || amount > 99999999) { setMsg('amount', '金額は1以上の整数で入力してください（例: 1590）', true); firstBad = firstBad || fAmount; }
  if (firstBad) { firstBad.focus(); return; }
  const data = { name, amount, cycle: getCycle(), memo: fldMemo.hidden ? '' : fMemo.value, paused: fPaused.getAttribute('aria-checked') === 'true' };
  if (editingId) {
    const idx = items.findIndex(i => i.id === editingId);
    if (idx >= 0) items[idx] = normalize({ ...items[idx], ...data });
    toast(`「${name}」を保存しました`);
  } else {
    items.push(normalize({ ...data, id: uid() }));
    toast(`「${name}」を追加しました`);
  }
  save(); render(); closeDialog();
});
fName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fAmount.focus(); } });
fAmount.addEventListener('focus', () => { const n = parseAmount(fAmount.value); if (n >= 1) fAmount.value = String(n); });
fAmount.addEventListener('blur', () => { const n = parseAmount(fAmount.value); if (n >= 1) fAmount.value = n.toLocaleString('ja-JP'); });
btnNote.addEventListener('click', () => { fldMemo.hidden = false; btnNote.hidden = true; fMemo.focus(); });
fPaused.addEventListener('click', () => fPaused.setAttribute('aria-checked', fPaused.getAttribute('aria-checked') === 'true' ? 'false' : 'true'));
$('#btnCancel').addEventListener('click', closeDialog);
btnDelete.addEventListener('click', () => {
  $('#confirmText').textContent = `「${fName.value.trim() || 'このサブスク'}」を削除しますか？`;
  btnDelete.hidden = true; actionsBox.hidden = true; confirmBox.hidden = false; $('#btnDeleteNo').focus();
});
$('#btnDeleteNo').addEventListener('click', () => { confirmBox.hidden = true; actionsBox.hidden = false; btnDelete.hidden = false; btnDelete.focus(); });
$('#btnDeleteYes').addEventListener('click', () => {
  const idx = items.findIndex(i => i.id === editingId);
  if (idx < 0) { closeDialog(); return; }
  const [removed] = items.splice(idx, 1);
  save(); render(); closeDialog();
  toast(`「${removed.name}」を削除しました`, '戻す', () => { items.splice(Math.min(idx, items.length), 0, removed); save(); render(); toast(`「${removed.name}」を戻しました`); });
});
$('#btnAdd').addEventListener('click', () => openDialog(null));
track.addEventListener('click', e => {
  const btn = e.target.closest('.card'); if (!btn) return;
  const it = items.find(i => i.id === btn.dataset.id); if (it) openDialog(it);
});

/* ── 並び替え ── */
const sortEl = $('#sort');
sortEl.value = sortMode;
sortEl.addEventListener('change', () => { sortMode = sortEl.value; try { localStorage.setItem(SORT_KEY, sortMode); } catch (e) {} render(); });

/* ── サンプル ── */
$('#btnSample').addEventListener('click', () => {
  items = [
    { name: 'Netflix', amount: 1590, cycle: 'month', memo: 'スタンダード' },
    { name: 'Spotify', amount: 1080, cycle: 'month' },
    { name: 'YouTube Premium', amount: 1280, cycle: 'month' },
    { name: 'iCloud+', amount: 130, cycle: 'month', memo: '50GB' },
    { name: 'Amazon プライム', amount: 5900, cycle: 'year' },
    { name: 'Kindle Unlimited', amount: 980, cycle: 'month', paused: true },
  ].map(normalize).filter(Boolean);
  save(); render();
  toast('サンプルを6件入れました。カードを押すと編集や削除ができます');
});

/* ── 設定 ── */
const dlgSettings = $('#dlgSettings');
$('#btnSettings').addEventListener('click', () => dlgSettings.showModal());
$('#btnSettingsClose').addEventListener('click', () => dlgSettings.close());

/* ── バックアップ（設定シートの中。通知が見えるようにシートは閉じてから出す） ── */
$('#btnExport').addEventListener('click', () => {
  const payload = { app: 'tsukizuki', version: 1, exportedAt: new Date().toISOString(), items };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `tsukizuki-backup-${toYMD(today())}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  dlgSettings.close();
  toast(`${items.length}件をバックアップとして保存しました`);
});
const fileEl = $('#fileImport'), dlgImport = $('#dlgImport');
let pendingImport = null;
$('#btnImport').addEventListener('click', () => { fileEl.value = ''; fileEl.click(); });
fileEl.addEventListener('change', async () => {
  const f = fileEl.files && fileEl.files[0]; if (!f) return;
  dlgSettings.close();
  let parsed = null;
  try { parsed = JSON.parse(await f.text()); } catch (e) { parsed = null; }
  const arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.items) ? parsed.items : null);
  const list = arr ? arr.map(normalize).filter(Boolean) : [];
  if (!list.length) { toast('読み込めませんでした。「バックアップを保存」で作ったJSONファイルを選んでください'); return; }
  pendingImport = list;
  $('#impText').textContent = `${list.length}件を読み込みます。今登録されている${items.length}件は、この内容に置き換わります。`;
  dlgImport.showModal(); $('#btnImportNo').focus();
});
$('#btnImportNo').addEventListener('click', () => dlgImport.close());
dlgImport.addEventListener('close', () => { pendingImport = null; });
$('#btnImportYes').addEventListener('click', () => {
  if (pendingImport) { items = pendingImport; pendingImport = null; save(); render(); toast(`${items.length}件を読み込みました`); }
  dlgImport.close();
});

/* ── 通知 ── */
const toastEl = $('#toast'), toastText = $('#toastText'), toastAction = $('#toastAction');
let toastTimer = null, toastHandler = null;
function toast(text, actionLabel, onAction) {
  clearTimeout(toastTimer);
  toastText.textContent = text;
  if (toastHandler) toastAction.removeEventListener('click', toastHandler);
  toastHandler = null;
  if (actionLabel && onAction) {
    toastAction.textContent = actionLabel; toastAction.hidden = false;
    toastHandler = () => { hideToast(); onAction(); };
    toastAction.addEventListener('click', toastHandler);
  } else { toastAction.hidden = true; }
  toastEl.hidden = false;
  toastTimer = setTimeout(hideToast, actionLabel ? 8000 : 4000);
}
function hideToast() { clearTimeout(toastTimer); toastEl.hidden = true; if (toastHandler) { toastAction.removeEventListener('click', toastHandler); toastHandler = null; } }

/* ── ヘッダーの下線（スクロール後だけ） ── */
const io = new IntersectionObserver(([entry]) => $('#top').classList.toggle('is-stuck', !entry.isIntersecting), { rootMargin: `-${$('#top').offsetHeight + 1}px 0px 0px 0px` });
io.observe($('#sentinel'));

/* ── 月が変わったら「2026年9月」の表示を更新する ── */
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
